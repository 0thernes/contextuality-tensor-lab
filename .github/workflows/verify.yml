name: Exact and formal verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  executable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/verify_exact.py
      - run: python -m unittest discover -s tests -v
      - run: node tests/demo.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: exact-certificates
          path: results/exact-certificate.json
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain manager
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Build every formal module
        working-directory: lean
        run: lake build
      - name: Audit every project theorem
        working-directory: lean
        run: python audit_axioms.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-axiom-audit
          path: |
            results/lean-axioms.log
            results/lean-axioms.json
